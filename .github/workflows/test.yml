name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        robotframework: ['4.1.3', '5.0.1', '6.1.1', '7.3']
    name: RF ${{ matrix.robotframework }} (py3.11)
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install GPG
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
        pip install "robotframework==${{ matrix.robotframework }}"

    - name: Show versions
      run: |
        python -c "import robot; print('RF', robot.version.VERSION)"
        gpg --version | head -1

    - name: Run unit tests
      run: pytest tests/

    - name: Run acceptance suite
      run: robot --outputdir results tests/acceptance/

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: robot-results-rf-${{ matrix.robotframework }}
        path: results/
